<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Prehravac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --surface:#0d1117;
  --panel:#111827;
  --border:#1e2d45;
  --border2:#243451;
  --accent:#2d6cdf;
  --accent-h:#3d7cf0;
  --ok:#16a34a;
  --ok-dim:#14532d;
  --bad:#dc2626;
  --bad-dim:#7f1d1d;
  --txt:#e8edf5;
  --txt2:#8fa3bf;
  --txt3:#4a6080;
  --r:6px;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100dvh}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.wrap{max-width:1140px;margin:0 auto;padding:24px 16px 80px}

.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:.03em;font-family:var(--mono);color:var(--txt)}
.topbar-title span{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--txt3);flex-shrink:0;transition:background .4s}
.dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e88}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px}
.card-head{padding:11px 18px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);font-family:var(--mono);display:flex;align-items:center;justify-content:space-between}
.body{padding:18px}

label{display:block;font-size:12px;font-weight:500;color:var(--txt2);margin:14px 0 5px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
label:first-child{margin-top:0}
input{width:100%;padding:10px 13px;font:15px/1 Inter,sans-serif;color:var(--txt);background:var(--panel);border:1px solid var(--border);border-radius:var(--r);transition:border-color .15s}
input:focus{outline:none;border-color:var(--accent)}
input[type=range]{padding:0;background:none;border:none;accent-color:var(--accent)}

.btn{font:500 13px/1 Inter,sans-serif;padding:8px 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--panel);color:var(--txt);cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap;letter-spacing:.02em}
.btn:hover{border-color:var(--border2);background:#192334}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ok{background:var(--ok-dim);border-color:var(--ok);color:#bbf7d0}
.btn.ok:hover{background:var(--ok)}
.btn.bad{background:var(--bad-dim);border-color:var(--bad);color:#fecaca}
.btn.bad:hover{background:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.msg{padding:9px 13px;border-radius:var(--r);margin-top:12px;font-size:13px;display:none;border-left:3px solid}
.msg.show{display:block}
.msg.e{background:#1f0a0a;border-color:var(--bad);color:#fca5a5}
.msg.s{background:#0a1f10;border-color:var(--ok);color:#86efac}

.player-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px}
@media(max-width:780px){.player-grid{grid-template-columns:1fr}}

.video-wrap{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.video-wrap iframe,.video-wrap div{width:100%;height:100%}

.now-title{font-size:17px;font-weight:600;margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.now-status{font-size:12px;color:var(--txt3);margin-top:3px;font-family:var(--mono)}

.vol-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.vol-label{font-size:12px;color:var(--txt3);font-family:var(--mono);width:28px;text-align:right}

.q{list-style:none}
.q li{display:flex;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);min-height:40px}
.q li:last-child{border:0}
.q-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--txt2)}
.q-title.cur{color:var(--accent);font-weight:600}
li.q-skip .q-title{color:var(--txt3);text-decoration:line-through}
.q-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.q-idx{font-size:11px;color:var(--txt3);font-family:var(--mono);width:20px;flex-shrink:0;text-align:right}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:8px 8px;border-bottom:1px solid var(--border2);font-size:11px;font-weight:600;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--txt2)}
td:first-child{color:var(--txt)}
td.act{white-space:nowrap;text-align:right}

.badge{padding:2px 8px;border-radius:3px;font-size:11px;font-family:var(--mono);font-weight:500}
.badge.ok{background:var(--ok-dim);color:#86efac;border:1px solid var(--ok)}
.badge.bad{background:var(--bad-dim);color:#fca5a5;border:1px solid var(--bad)}

#loginWrap{max-width:380px;margin:80px auto 0}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--txt3);margin-bottom:28px;font-family:var(--mono)}
.login-line{width:32px;height:2px;background:var(--accent);margin-bottom:28px}

.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-title">Admin</div>
  <div class="login-sub">přihlášení do přehrávače</div>
  <div class="login-line"></div>
  <div class="card">
    <div class="body">
      <label for="lgU">Uživatelské jméno</label>
      <input id="lgU" placeholder="tomas_kudelka" autocomplete="username">
      <label for="pw">Heslo</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <div style="margin-top:16px"><button class="btn p" style="width:100%;padding:11px" onclick="doLogin()">Přihlásit se</button></div>
      <div class="msg" id="lMsg"></div>
    </div>
  </div>
</div>

<!-- PANEL -->
<div id="panel" class="hide">
  <div class="topbar">
    <div class="dot" id="dot"></div>
    <div class="topbar-title">prehravac<span>/admin</span></div>
    <div class="topbar-right">
      <button class="btn sm" onclick="doLogout()">Odhlásit</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">prehravac</div>
    <div class="body player-grid">
      <div>
        <div class="video-wrap"><div id="yt"></div></div>
        <div class="now-title" id="nowTitle">Nic nehraje</div>
        <div class="now-status" id="nowStatus">—</div>
        <div class="row" style="margin-top:14px">
          <button class="btn" onclick="ytCmd('prev')">Předchozí</button>
          <button class="btn p" id="togBtn" onclick="ytCmd('toggle')">Přehrát</button>
          <button class="btn" onclick="ytCmd('next')">Další</button>
        </div>
        <div class="vol-row">
          <span style="font-size:12px;color:var(--txt3);font-family:var(--mono)">hlasitost</span>
          <input type="range" id="vol" min="0" max="100" value="80" style="flex:1" oninput="setVol(this.value)">
          <span class="vol-label" id="volVal">80</span>
        </div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);font-family:var(--mono);margin-bottom:10px">fronta</div>
        <ul class="q" id="admQ"></ul>
        <div class="row" style="margin-top:14px">
          <input id="aL" placeholder="Přidat odkaz rovnou..." style="flex:1;min-width:0">
          <button class="btn p" onclick="addDirect()">Přidat</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn sm" onclick="cleanDone()">Vyčistit odehrané</button>
        </div>
        <div class="msg" id="aMsg"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">čekající požadavky <span id="pendCount" style="color:var(--accent)"></span></div>
    <div class="body" id="pend" style="overflow-x:auto"></div>
  </div>

  <div class="card">
    <div class="card-head">historie</div>
    <div class="body" id="hist" style="overflow-x:auto"></div>
  </div>

  <div class="card">
    <div class="card-head">nastavení</div>
    <div class="body">
      <div class="row" style="gap:16px;align-items:flex-start">
        <div style="flex:1;min-width:180px">
          <label for="sCd">Cooldown (minuty)</label>
          <input id="sCd" type="number" min="0" max="120">
        </div>
        <div style="flex:1;min-width:180px">
          <label for="sUser">Uživatelské jméno</label>
          <input id="sUser" placeholder="tomas_kudelka">
        </div>
        <div style="flex:1;min-width:180px">
          <label for="sPw">Nové heslo</label>
          <input id="sPw" type="password" placeholder="Nové heslo">
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn p" onclick="saveSettings()">Uložit</button>
        <button class="btn bad" onclick="clearAll()">Smazat vše</button>
      </div>
      <div class="msg" id="sMsg"></div>
    </div>
  </div>
</div>
</div>

<script src="shared.js"></script>
<script>
let S = loadState();
function loadState(){
  try{return Object.assign({reqs:[],queue:[],cur:-1,cd:COOLDOWN_MIN,pw:ADMIN_PASSWORD,user:'tomas_kudelka',last:{}},
    JSON.parse(localStorage.getItem('prehravac')||'{}'))
