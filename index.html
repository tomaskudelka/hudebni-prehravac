<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prehravac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --surface:#0d1117;
  --panel:#111827;
  --border:#1e2d45;
  --border2:#243451;
  --accent:#2d6cdf;
  --accent-h:#3d7cf0;
  --ok:#16a34a;
  --bad:#dc2626;
  --txt:#e8edf5;
  --txt2:#8fa3bf;
  --txt3:#4a6080;
  --r:6px;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font:15px/1.6 Inter,system-ui,sans-serif;min-height:100dvh}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.wrap{max-width:640px;margin:0 auto;padding:32px 16px 80px}

.topbar{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:.03em;font-family:var(--mono);color:var(--txt)}
.topbar-title span{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--txt3);flex-shrink:0;transition:background .4s}
.dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e88}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px}
.card-head{padding:11px 18px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);font-family:var(--mono)}
.body{padding:18px}

label{display:block;font-size:12px;font-weight:500;color:var(--txt2);margin:14px 0 5px;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
label:first-child{margin-top:0}
input{width:100%;padding:10px 13px;font:15px/1 Inter,sans-serif;color:var(--txt);background:var(--panel);border:1px solid var(--border);border-radius:var(--r);transition:border-color .15s}
input:focus{outline:none;border-color:var(--accent)}

.btn{font:500 13px/1 Inter,sans-serif;padding:10px 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--accent);color:#fff;cursor:pointer;transition:background .15s;width:100%;letter-spacing:.02em;margin-top:14px}
.btn:hover{background:var(--accent-h)}

.msg{padding:9px 13px;border-radius:var(--r);margin-top:12px;font-size:13px;display:none;border-left:3px solid}
.msg.show{display:block}
.msg.e{background:#1f0a0a;border-color:var(--bad);color:#fca5a5}
.msg.s{background:#0a1f10;border-color:var(--ok);color:#86efac}

.now-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:16px}
.now-label{font-size:11px;font-family:var(--mono);color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.now-title{font-size:16px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.q{list-style:none}
.q li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--txt2)}
.q li:last-child{border:0}
.q-idx{font-size:11px;color:var(--txt3);font-family:var(--mono);width:20px;flex-shrink:0;text-align:right}
.q-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="dot" id="dot"></div>
    <div class="topbar-title">hudebni<span>fronta</span></div>
  </div>

  <div class="now-box">
    <div class="now-label">Právě hraje</div>
    <div class="now-title" id="nowPlaying">Nic nehraje</div>
  </div>

  <div class="card">
    <div class="card-head">Pridat pisnicku</div>
    <div class="body">
      <label for="uLink">YouTube odkaz</label>
      <input id="uLink" placeholder="https://www.youtube.com/watch?v=...">
      <label for="uTitle">Nazev (nepovinne)</label>
      <input id="uTitle" placeholder="Např. Interpret - Písnička">
      <button class="btn" id="subBtn" onclick="sendReq()">Odeslat pozadavek</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">Fronta</div>
    <div class="body">
      <ul class="q" id="qList"></ul>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let ably, chIn, chState;
function devId(){
  let id=localStorage.getItem('dev_id');
  if(!id){id='d_'+Math.random().toString(36).slice(2)+Date.now();localStorage.setItem('dev_id',id);}
  return id;
}

function init(){
  ably = new Ably.Realtime({key:ABLY_KEY,echoMessages:false});
  ably.connection.on('connected',()=>$('dot').classList.add('on'));
  ably.connection.on('disconnected',()=>$('dot').classList.remove('on'));
  chIn = ably.channels.get(NS+':in');
  chState = ably.channels.get(NS+':state');
  chState.subscribe(msg => updateUI(msg.data));
}

function sendReq(){
  const link = $('uLink').value.trim();
  const title = $('uTitle').value.trim();
  if(!link) return showMsg('Zadej odkaz.','e');
  
  chIn.publish('req', {cid:devId(), link, title: title || link});
  $('uLink').value = '';
  $('uTitle').value = '';
  showMsg('Pozadavek odeslan adminovi.','s');
}

function updateUI(d){
  const q = d.queue || [];
  const cur = d.cur;
  
  const curTrack = (cur >= 0 && q[cur] && q[cur].on !== false) ? q[cur] : null;
  $('nowPlaying').textContent = curTrack ? curTrack.title : 'Nic nehraje';
  
  const activeQ = q.filter(item => item.on !== false);
  $('qList').innerHTML = activeQ.length ? activeQ.map((item, i)=>`
    <li>
      <span class="q-idx">${i+1}</span>
      <span class="q-title">${esc(item.title)}</span>
    </li>
  `).join('') : '<li style="color:var(--txt3)">Fronta je prazdna.</li>';
}

function showMsg(t, type){
  const m = $('msg');
  m.textContent = t;
  m.className = 'msg show ' + type;
}

window.onload = init;
</script>
</body>
</html>
